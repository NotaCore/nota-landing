name: CI/CD nota-landing

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCW_REGISTRY: rg.fr-par.scw.cloud
  SCW_NAMESPACE: notacore-app
  IMAGE_NAME: nota-landing

jobs:
  build-and-push:
    name: CD — Build & Push image Docker
    runs-on: [self-hosted, nota-landing]

    steps:
      - uses: actions/checkout@v4

      - name: Login Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build & Push :sha-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Déclencher le pipeline de déploiement
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/NotaCore/nota-deployement/dispatches" \
            -d "{\"event_type\":\"service-updated\",\"client_payload\":{\"service\":\"${{ env.IMAGE_NAME }}\",\"tag\":\"sha-${{ github.sha }}\"}}"
